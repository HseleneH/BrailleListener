<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function conditionTextFromNames(names) {
            // 初始化 112 組點狀態
            const states = Array.from({ length: groupCount }, () => [0, 0, 0, 0, 0, 0]);

            // 將 names 裡面的 "x-y" 標記設為 1
            for (const name of names) {
                const [groupStr, dotStr] = name.split('-');
                const group = parseInt(groupStr) - 1;  // 轉為 index
                const dot = parseInt(dotStr) - 1;
                if (group >= 0 && group < groupCount && dot >= 0 && dot < 6) {
                states[group][dot] = 1;
                }
            }

            // 點字對照表：key 為6位二進位字串，value 為英文字母
            const brailleMap = {
                '100000': 'A', '101000': 'B', '110000': 'C', '110100': 'D', '100100': 'E',
                '111000': 'F', '111100': 'G', '101100': 'H', '011000': 'I', '011100': 'J',
                '100010': 'K', '101010': 'L', '110010': 'M', '110110': 'N', '100110': 'O',
                '111010': 'P', '111110': 'Q', '101110': 'R', '011010': 'S', '011110': 'T',
                '100011': 'U', '101011': 'V', '011101': 'W', '110011': 'X', '110111': 'Y', '100111': 'Z'
            };

            // 結果字串
            let result = '';
            for (let g = 0; g < groupCount; g++) {
                const bits = states[g].join('');
                if (bits.includes('1')) {
                result += brailleMap[bits] || '?';
                }
            }

            return result;
}
names = ["1-1", "1-2", "3-1", "3-4"];
conditionTextFromNames(names);

    </script>
</body>
</html>
